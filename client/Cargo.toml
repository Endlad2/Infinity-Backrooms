[package]
name = "backrooms-client"
version = "0.2.0"
edition = "2021"
description = "Backrooms Infinity game client (Rust + Bevy)"

[[bin]]
name = "backrooms-client"
path = "src/main.rs"

[dependencies]
bevy = "0.14"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# roxmltree удалён — парсим своим валидатором в ai/parse.rs
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
resvg = "0.42"
tiny-skia = "0.11"
usvg = "0.42"
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
rand = "0.8"
byteorder = "1"

[dev-dependencies]
tempfile = "3"
